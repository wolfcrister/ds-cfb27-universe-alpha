storylines:
  - id: storyline-corporate-legitimacy
    title: Corporate Legitimacy
    category: world
    status: active
    importance: primary
    premise: >
      FedEx University has elite resources but no football history, alumni culture
      or accepted place in traditional college football.
    started:
      season: 2027
      phase: preseason
    participants:
      - fedex-university
      - daniel-sandberg
      - national-media
    current_state: >
      National attention is extremely high, but much of college football views
      the Couriers as a corporate marketing project rather than a legitimate institution.
    open_questions:
      - Can FedEx win without appearing to have purchased legitimacy?
      - Will traditional programs accept FedEx University as a real institution?
      - Can a corporate university create genuine football culture?

  - id: storyline-inaugural-roster
    title: Building a Team From Nothing
    category: football
    status: active
    importance: primary
    premise: >
      FedEx University has no returning roster and must assemble its first team
      through freshmen, junior-college players and transfer-portal additions.
    started:
      season: 2027
      phase: preseason
    participants:
      - fedex-university
      - daniel-sandberg
    current_state: >
      Elite resources can attract talent, but experience, depth and cohesion
      cannot be purchased instantly.
    open_questions:
      - Who becomes the first starting quarterback in program history?
      - Which veterans become the first team leaders?
      - Can a newly assembled roster contend immediately in Tier 3?

  - id: storyline-climb-the-pyramid
    title: Climb the Pyramid
    category: league
    status: active
    importance: major
    premise: >
      FedEx University begins in Tier 3 and must earn every promotion through performance.
    started:
      season: 2027
      phase: preseason
    participants:
      - fedex-university
      - daniel-sandberg
    current_state: >
      The institution possesses top-level ambition and resources but starts at the bottom
      of the competitive structure.
    open_questions:
      - How quickly can FedEx earn promotion?
      - What conference becomes its first geographic home?
      - When will the program be regarded as a true national power?
