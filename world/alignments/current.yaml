    FedEx University is guaranteed the replaced Kennesaw State position in
    Tier 3. The other five places go to the five lowest-rated remaining teams.

border_decisions:
  - id: tier1-west-east-cut
    decision: LSU assigned to Big 12 as the 16th western program
    reason: LSU is the westernmost remaining Tier 1 border program after the first 15 western assignments
  - id: tier2-kansas-state-west
    decision: Kansas State assigned to Mountain West
    reason: required to complete the 25-team West macro-region and fits the Plains-to-Mountain border
  - id: tier2-north-dakota-state-west
    decision: NDSU assigned to Mountain West
    reason: northern Plains geography fits the interior West identity better than the Central urban corridor
  - id: tier2-liberty-mac
    decision: Liberty assigned to MAC
    reason: completes the East/North macro-region split while preserving the ACC as the Atlantic and Northeast group

tiebreak_decisions:
  - id: seventh-unranked-tier1-place
    candidates:
      - South Carolina
      - Arizona
      - Florida State
      - UCLA
    overall_rating: 82
    selected: South Carolina
    method:
      - higher defensive rating
      - higher offensive rating
    explanation: >
      South Carolina and Arizona had the highest defensive rating among the tied teams.
      South Carolina then won on offensive rating.

