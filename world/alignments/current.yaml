structure:
  total_programs: 138
  tier_1: 32
  tier_2: 100
  tier_3: 6
  note: >
    CFB 27 contains four more programs than CFB 25. Tier 1 and Tier 3 retain
    their inherited sizes. Tier 2 therefore contains 100 programs, divided
    into four geographic macro-regions of 25. Each macro-region is split into
    one 13-team conference and one 12-team conference.

