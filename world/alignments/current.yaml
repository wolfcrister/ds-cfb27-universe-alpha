border_decisions:
  - id: tier1-west-east-cut
    decision: LSU assigned to Big 12 as the 16th western program
    reason: LSU is the westernmost remaining Tier 1 border program after the first 15 western assignments
  - id: tier2-kansas-state-west
    decision: Kansas State assigned to Mountain West
    reason: fits the Plains-to-Mountain border and the interior West identity
  - id: tier2-north-dakota-state-west
    decision: NDSU assigned to Mountain West
    reason: northern Plains geography fits the interior West identity
  - id: tier2-kansas-west
    decision: Kansas assigned to Mountain West
    reason: required to restore the 24-team West macro-region after Tier 3 expansion
  - id: tier2-minnesota-west
    decision: Minnesota assigned to Mountain West
    reason: northern geography balances the West macro-region at 24 teams
  - id: tier2-marshall-central
    decision: Marshall assigned to AAC
    reason: restores the Central macro-region to 24 and matches the inherited lower-Midwest/Appalachian border logic

tiebreak_decisions:
  - id: seventh-unranked-tier1-place
    candidates:
      - South Carolina
      - Arizona
      - Florida State
      - UCLA
    overall_rating: 82
    selected: South Carolina
    method:
      - higher defensive rating
      - higher offensive rating
    explanation: >
      South Carolina and Arizona had the highest defensive rating among the tied teams.
      South Carolina then won on offensive rating.

